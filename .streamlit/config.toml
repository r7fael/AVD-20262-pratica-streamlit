# Identidade visual — baseada na paleta da EDA (rosa = Normal, roxo = Cardíaco).
# 3 cores-base:
#   roxo profundo #5b3f8c  → cor de destaque (primaryColor) e tema "cardíaco"
#   roxo médio    #7f5fb8  → classe Cardíaco nos gráficos
#   coral         #c4786a  → classe Normal nos gráficos
# As duas cores de classe têm contraste ≥ 3:1 tanto no fundo claro quanto no escuro.
# O modo claro/escuro pode ser trocado pelo menu ⋮ → Settings.

[theme]
paddingTop = "1.5rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseRadius = "0.6rem"
showSidebarBorder = true
metricValueFontWeight = 600

[theme.light]
primaryColor = "#5b3f8c"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f7f2f1"
textColor = "#2d223a"
borderColor = "#e9d4d0"
chartCategoricalColors = ["#7f5fb8", "#c4786a", "#2d223a", "#b59ad9"]

[theme.dark]
primaryColor = "#b59ad9"
backgroundColor = "#17121f"
secondaryBackgroundColor = "#241c30"
textColor = "#f1eaf0"
borderColor = "#3a2f48"
chartCategoricalColors = ["#7f5fb8", "#c4786a", "#f1eaf0", "#b59ad9"]
